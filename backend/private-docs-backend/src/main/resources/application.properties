spring.application.name=private-docs-backend

server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


# =========================
# GEMINI
# =========================

spring.ai.google.genai.api-key=${GEMINI_API_KEY}

spring.ai.google.genai.chat.model=gemini-2.5-flash
spring.ai.google.genai.chat.temperature=0.2


# =========================
# GEMINI EMBEDDING
# =========================

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

spring.ai.google.genai.embedding.text.model=text-embedding-004

spring.ai.google.genai.embedding.text.task-type=RETRIEVAL_DOCUMENT

# =========================================================
# JWT
# =========================================================

# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.web=INFO